<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ചെലവ് ട്രാക്കർ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--acx:#fff;--bd:#e5e7eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mu:#9aa3ad;--ac:#2dd4bf;--acx:#06201d;--bd:#2c333b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mu:#9aa3ad;--ac:#2dd4bf;--acx:#06201d;--bd:#2c333b;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans Malayalam",sans-serif}
.w{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{width:40px;height:40px;font-size:20px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-bottom:8px}
.big{font-size:32px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.over i{background:var(--bad)}
.cat{margin-bottom:10px}
.cat div{display:flex;justify-content:space-between}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it b{white-space:nowrap}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 8px}
h3{margin:0 0 10px;font-size:16px}
</style>
</head>
<body>
<div class="w">
  <div class="card">
    <div class="nav"><button id="pv" aria-label="മുൻ മാസം">‹</button><b id="mn"></b><button id="nx" aria-label="അടുത്ത മാസം">›</button></div>
    <div class="big" id="tot">₹0</div>
    <div class="mu" id="bt"></div>
    <div class="bar" id="bb" hidden><i></i></div>
    <div class="row" style="margin-top:10px"><input id="bg" type="number" inputmode="decimal" placeholder="പ്രതിമാസ ബജറ്റ് (₹)"><button id="sb">സെറ്റ്</button></div>
  </div>

  <div class="card">
    <h3>ചെലവ് ചേർക്കുക</h3>
    <div class="row"><input id="am" type="number" inputmode="decimal" placeholder="തുക (₹)"><input id="dt" type="date"></div>
    <div class="row"><select id="ct"></select><input id="nt" placeholder="കുറിപ്പ് (ഓപ്ഷണൽ)"></div>
    <button class="p" id="ad" style="width:100%">ചേർക്കുക</button>
  </div>

  <div class="card"><h3>വിഭാഗം തിരിച്ച്</h3><div id="cs"></div></div>
  <div class="card"><h3>ഈ മാസത്തെ ചെലവുകൾ</h3><div id="ls"></div></div>
  <p class="mu" id="st" style="text-align:center"></p>
</div>
<script>
var CATS=["ഭക്ഷണം","യാത്ര","വാടക","ബില്ലുകൾ","ഷോപ്പിംഗ്","ആരോഗ്യം","വിനോദം","മറ്റുള്ളവ"];
var S={items:[],budget:0},cur=new Date(),ref=null,mode="local";
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})};
var key=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
var today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
CATS.forEach(function(c){var o=document.createElement("option");o.textContent=c;$("ct").appendChild(o)});
$("dt").value=today();

function save(){
  if(ref){ref.set(S).catch(function(){$("st").textContent="സേവ് ചെയ്യാനായില്ല"})}
  try{localStorage.setItem("exp-v1",JSON.stringify(S))}catch(e){}
}
function load(d){if(d&&Array.isArray(d.items)){S={items:d.items,budget:Number(d.budget)||0}}}
function render(){
  var k=key(cur);
  $("mn").textContent=cur.toLocaleDateString("ml-IN",{month:"long",year:"numeric"});
  var L=S.items.filter(function(x){return x.d.slice(0,7)===k}).sort(function(a,b){return a.d<b.d?1:-1});
  var t=L.reduce(function(s,x){return s+x.a},0);
  $("tot").textContent=fmt(t);
  var bb=$("bb");
  if(S.budget>0){
    bb.hidden=false;bb.className="bar"+(t>S.budget?" over":"");
    bb.firstChild.style.width=Math.min(100,t/S.budget*100)+"%";
    $("bt").textContent=t>S.budget?fmt(t-S.budget)+" ബജറ്റിന് മുകളിൽ":fmt(S.budget-t)+" ബാക്കി (ബജറ്റ് "+fmt(S.budget)+")";
  }else{bb.hidden=true;$("bt").textContent="ബജറ്റ് സെറ്റ് ചെയ്തിട്ടില്ല"}
  var by={};L.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
  var cs=$("cs");cs.textContent="";
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!ks.length){cs.innerHTML='<span class="mu">ചെലവുകൾ ഇല്ല</span>'}
  ks.forEach(function(c){
    var e=document.createElement("div");e.className="cat";
    var r=document.createElement("div");
    var a=document.createElement("span");a.textContent=c;
    var b=document.createElement("b");b.textContent=fmt(by[c]);
    r.appendChild(a);r.appendChild(b);
    var br=document.createElement("div");br.className="bar";
    var i=document.createElement("i");i.style.width=(by[c]/t*100)+"%";br.appendChild(i);
    e.appendChild(r);e.appendChild(br);cs.appendChild(e);
  });
  var ls=$("ls");ls.textContent="";
  if(!L.length){ls.innerHTML='<span class="mu">ഈ മാസം ചെലവുകൾ ഒന്നുമില്ല</span>'}
  L.forEach(function(x){
    var e=document.createElement("div");e.className="it";
    var l=document.createElement("div");
    var n=document.createElement("div");n.textContent=x.c+(x.n?" · "+x.n:"");
    var m=document.createElement("div");m.className="mu";m.textContent=x.d.split("-").reverse().join("/");
    l.appendChild(n);l.appendChild(m);
    var r=document.createElement("div");
    var b=document.createElement("b");b.textContent=fmt(x.a);
    var del=document.createElement("button");del.className="x";del.textContent="✕";del.setAttribute("aria-label","ഡിലീറ്റ്");
    del.onclick=function(){S.items=S.items.filter(function(y){return y.id!==x.id});save();render()};
    r.appendChild(b);r.appendChild(del);
    e.appendChild(l);e.appendChild(r);ls.appendChild(e);
  });
}
$("pv").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("nx").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("sb").onclick=function(){S.budget=Math.max(0,parseFloat($("bg").value)||0);$("bg").value="";save();render()};
$("ad").onclick=function(){
  var a=parseFloat($("am").value);
  if(!(a>0)){$("am").focus();return}
  var d=$("dt").value||today();
  S.items.push({id:Date.now()+""+Math.floor(Math.random()*1000),a:a,d:d,c:$("ct").value,n:$("nt").value.trim()});
  $("am").value="";$("nt").value="";
  cur=new Date(+d.slice(0,4),+d.slice(5,7)-1,1);
  save();render();
};
try{load(JSON.parse(localStorage.getItem("exp-v1")))}catch(e){}
render();
</script>
</body>
</html>
